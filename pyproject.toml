[project]
name = "germ"
version = "0.1.0"
description = "Local Stable Audio 3 server and dashboard for germ."
readme = "README.md"
license = "MPL-2.0"
requires-python = ">=3.10"
dependencies = [
    "akousma>=0.4.0",
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30.0",
]

[tool.uv.sources]
akousma = { git = "https://github.com/sonicfieldlabs/earworm.git", tag = "v0.4.0", subdirectory = "packages/py-akousma" }

[project.optional-dependencies]
python-provider = [
    "stable-audio-3 @ git+https://github.com/Stability-AI/stable-audio-3.git",
]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
