[project]
name = "germ"
version = "0.5.0"
description = "Local-first modular laboratory for generative microsound, Stable Audio workflows, and lineage-aware cultivation."
readme = "README.md"
license = "MPL-2.0"
requires-python = ">=3.10"
authors = [{ name = "Sonic Field Labs" }]
dependencies = [
    "akousma>=0.7.0",
    "numpy>=1.26,<3",
    "soundfile>=0.13.1,<0.14",
    "akouo-contract>=0.9.2",
    "fastapi>=0.139",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.31",
    "uvicorn[standard]>=0.30.0",
]

[tool.uv]
override-dependencies = [
    "torch==2.10.0",
    "torchaudio==2.10.0",
]

[tool.uv.sources]
# Local stack development uses the current unreleased canonical contracts.
akousma = { path = "../earworm/packages/py-akousma" }
akouo-contract = { path = "../akouo" }

[project.urls]
Homepage = "https://github.com/sonicfieldlabs/germ"
Repository = "https://github.com/sonicfieldlabs/germ"
Issues = "https://github.com/sonicfieldlabs/germ/issues"

[project.optional-dependencies]
python-provider = [
    "stable-audio-3 @ git+https://github.com/Stability-AI/stable-audio-3.git",
]
dev = [
    "httpx2>=2.7",
    "pytest>=8.2.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
