# Portable PR checks run once; full platform qualification is deliberate.
name: CI

on:
  pull_request:
    branches:
    - main
  workflow_dispatch:
    inputs:
      full:
        description: Run complete platform and release qualification (prefer local execution)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.11.18"
      UV_PYTHON_DOWNLOADS: never
    defaults:
      run:
        working-directory: germ
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
          path: germ
      - name: Use a maintained CI Python patch
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.18"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
      - name: Record Node.js runtime
        run: node --version

      - name: Verify reviewed canonical dependency wheels
        run: shasum -a 256 -c vendor/SHA256SUMS

      - name: Install Python dependencies
        run: uv sync --extra dev --locked
      - name: Python tests
        run: uv run pytest -q
      - name: Ruff
        run: uv run ruff check server tests
      - name: Audit full registry graph without advisory suppressions
        run: |
          uv export --locked --all-extras --no-emit-project --no-emit-local > "$RUNNER_TEMP/dependencies.txt"
          uv run python scripts/audit_dependencies.py \
            --requirements "$RUNNER_TEMP/dependencies.txt" \
            --output "$RUNNER_TEMP/dependency-audit.json"

      - name: Dashboard syntax
        run: |
          node --check dashboard/static/app.js
          node --check dashboard/static/audio_engine.js
          node --check dashboard/static/cosmoaudition.js
          node --check dashboard/static/dish.js
          node --check dashboard/static/docs_theme.js
          node --check dashboard/static/micro_forms.js
          node --check dashboard/static/micro_render.js
          node --check dashboard/static/micro_unicode.js
          node --check dashboard/static/ui_utils.js
          node --check dashboard/static/wavetable_synth.js
      - name: Dashboard smoke
        run: node scripts/smoke_dashboard.mjs

  optional-native:
    if: inputs.full == true
    name: Optional native audio fixture
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OIDA_ALLOW_HF_HUB: "0"
      UV_PYTHON: "3.14.10"
      UV_PYTHON_DOWNLOADS: never
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.10"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.7"
      - name: Verify canonical wheels
        run: shasum -a 256 -c vendor/SHA256SUMS
      - name: Bind FFmpeg shared libraries
        run: |
          command -v ffmpeg >/dev/null || brew install ffmpeg
          library_dir="$(brew --prefix ffmpeg)/lib"
          test -d "$library_dir"
          {
            echo "DYLD_LIBRARY_PATH=$library_dir"
            echo "DYLD_FALLBACK_LIBRARY_PATH=$library_dir"
            echo "OIDA_FFMPEG_LIB_DIR=$library_dir"
          } >> "$GITHUB_ENV"
      - name: Install locked optional SDK without model weights
        run: uv sync --locked --extra python-provider
      - name: Exercise synthetic CPU audio and SDK imports
        run: uv run --locked --extra python-provider python scripts/smoke_optional_torch.py
