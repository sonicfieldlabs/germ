name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: germ
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          path: germ
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.3"
      - name: Verify reviewed canonical dependency wheels
        run: shasum -a 256 -c vendor/SHA256SUMS

      - name: Install Python dependencies
        run: uv sync --extra dev --locked
      - name: Python tests
        run: uv run pytest -q
      - name: Ruff
        run: uv run ruff check server tests
      - name: Audit dependency graph with dated exceptions
        run: |
          uv export --locked --all-extras --no-emit-project --no-emit-local > "$RUNNER_TEMP/dependencies.txt"
          uv run python scripts/audit_dependencies.py \
            --requirements "$RUNNER_TEMP/dependencies.txt" \
            --output "$RUNNER_TEMP/dependency-audit.json"

      - name: Dashboard syntax
        run: |
          node --check dashboard/static/app.js
          node --check dashboard/static/audio_engine.js
          node --check dashboard/static/cosmoaudition.js
          node --check dashboard/static/dish.js
          node --check dashboard/static/docs_theme.js
          node --check dashboard/static/micro_forms.js
          node --check dashboard/static/micro_render.js
          node --check dashboard/static/micro_unicode.js
          node --check dashboard/static/ui_utils.js
          node --check dashboard/static/wavetable_synth.js
      - name: Dashboard smoke
        run: node scripts/smoke_dashboard.mjs
